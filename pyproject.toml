[project]
name = "ai-trading"
version = "0.1.0"
description = "Local platform for paper-trading bots on Bybit USDT Perpetuals"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pybit>=5.9",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=18.0",
    "apscheduler>=3.10",
    "watchfiles>=0.24",
    "httpx>=0.28",
    "typer>=0.15",
]

[project.scripts]
app = "app.cli:cli"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "bots"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
